[project]
name = "grocery_planner"
version = "0.1.0"
description = "Multi-agent grocery planner backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "google-genai>=2.30.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grocery_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs SUPABASE_DB_URL (a real Postgres); skipped otherwise",
    "live: calls the real Gemini API; only runs with -m live",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
